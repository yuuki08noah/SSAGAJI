<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}싸가지 설문{% endblock %}</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --danger: #ef4444;
      --success: #10b981;
      --warn: #f59e0b;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .navbar {
      background: var(--primary);
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .navbar h1 { font-size: 1.1rem; font-weight: 700; }

    .container {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 36px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }

    h2 { font-size: 1.5rem; margin-bottom: 8px; }
    p.lead { color: var(--muted); margin-bottom: 24px; line-height: 1.7; }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-outline:hover { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
    .form-group select,
    .form-group input[type=text],
    .form-group input[type=number] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    .form-group select:focus,
    .form-group input:focus { border-color: var(--primary); }

    .progress-bar-wrap {
      background: var(--border);
      border-radius: 99px;
      height: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .chip-blue { background: #ede9fe; color: var(--primary); }

    footer {
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4M3 11V7a9 9 0 0118 0v4"/>
    </svg>
    <h1>싸가지 점수 설문 조사</h1>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer>AI 음성 무례함 측정 연구 &copy; 2025</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
