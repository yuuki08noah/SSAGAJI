{% extends "base.html" %}
{% block title %}설문 완료{% endblock %}

{% block content %}
<div class="card" style="text-align:center;">
  <div style="font-size:4rem;margin-bottom:16px;">🎉</div>
  <h2>설문이 완료되었습니다!</h2>
  <p class="lead">소중한 응답에 감사드립니다.<br>수집된 데이터는 AI 음성 무례함 측정 연구에 활용됩니다.</p>

  <div style="background:#f0fdf4;border-radius:10px;padding:20px;margin:20px 0;text-align:left;">
    <h3 style="font-size:1rem;margin-bottom:12px;color:#166534;">나의 응답 요약</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;">
      {% for af in audio_files %}
      <div style="background:white;border-radius:8px;padding:10px;border:1px solid #d1fae5;">
        <div style="font-size:0.75rem;color:#6b7280;margin-bottom:4px;">{{ af.filename[:20] }}</div>
        <div style="font-size:1.5rem;font-weight:700;color:{% if ratings[af.id|string]|int >= 4 %}#dc2626{% elif ratings[af.id|string]|int <= 2 %}#059669{% else %}#d97706{% endif %}">
          {{ ratings[af.id|string] }}점
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

  <a href="/" class="btn btn-primary" style="margin-top:8px;">처음으로 돌아가기</a>
</div>
{% endblock %}
